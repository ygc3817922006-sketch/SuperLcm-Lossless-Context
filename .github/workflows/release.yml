name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - id: pack
        shell: bash
        run: |
          archive="$(npm pack --silent)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          sha256sum "$archive" > SHA256SUMS.txt
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## SuperLcm public alpha / 公开测试版

          仓库根 README 是默认中文、可切换英文的详细项目介绍。本版本重点说明 LCM 原理、全面异步压缩、较小活动上下文、稳定缓存前缀、SQLite 无损召回与成本边界，并加入 Windows、Linux、macOS CI。

          The repository README is the Chinese-default bilingual project home. It documents the LCM foundation, fully asynchronous compaction, bounded active context, prefix-stable caching, SQLite-backed exact recall, provider-dependent cost savings, and CI on Windows, Linux, and macOS.

          > Install into a dedicated DSH profile and follow the validation guide before enabling it in a primary workspace.
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" SHA256SUMS.txt \
            --title "SuperLcm $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --prerelease
