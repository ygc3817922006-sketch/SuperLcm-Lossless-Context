# 仅供示例：请复制到新的 preset id 后再编辑。
# Example only: copy this under a NEW preset id before editing.
# 不要在原有压缩提供方旁边再添加第二个。
# Do not add a second compaction provider beside the original one.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: SuperLcm-compaction
      name: SuperLcm
      config:
        # 这些选项会转发给 BasicCompactionEngine。
        # These options are forwarded to BasicCompactionEngine.
        auto: true
        thresholdRatio: 0.80
        retainRatio: 0.16

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
